; M5Stack Tab5 — ADR 0049
[env:tab5]
platform  = https://github.com/pioarduino/platform-espressif32.git#55.03.311
board     = esp32-p4-evboard
framework = arduino
board_build.mcu = esp32p4
board_build.flash_mode = qio
board_upload.flash_size = 16MB
monitor_speed = 115200
upload_speed  = 1500000

; No dedicated m5stack-tab5 board profile exists upstream yet (checked
; pioarduino/platform-espressif32's boards/ dir directly — only
; esp32-p4-evboard.json and its _r3 variant). esp32-p4-evboard already
; carries flash=16MB, flash_mode=qio, f_cpu=360MHz and a 200MHz PSRAM
; frequency, which is what Tab5 needs; SDIO pins differ from the evboard
; and are overridden in code via WiFi.setPins() before WiFi.begin().
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Forces M5GFX straight to the board_M5Tab5 (=22, boards.hpp) init path,
    ; skipping its full multi-board I2C/SPI autodetection gauntlet. Without
    ; this, M5.begin() probes every board M5GFX supports in sequence on a
    ; generic/unforced board profile -- and on real Tab5 hardware this hung
    ; before ever reaching our own Serial.begin() call (proven by isolating
    ; Serial/HWCDC in main_serial_test.cpp, which worked fine standalone).
    -DM5GFX_BOARD=22

; Screenshot milestone (ADR 0049) is self-contained and does not touch
; menu.cpp/keyinject.cpp (Cardputer TCA8418 keyboard) or wifi_manager*.cpp
; (multi-profile/SoftAP logic, deliberately not used yet). Excluded so a
; Tab5 build failure can only be the Tab5 bring-up itself.
build_src_filter =
    +<*>
    -<menu.cpp>
    -<keyinject.cpp>
    -<wifi_manager.cpp>
    -<wifi_manager_rt.cpp>
    -<main.cpp>
    -<main_serial_test.cpp>
    -<main_tab5_mirror.cpp>
    -<main_tab5_keyboard.cpp>

lib_deps =
    m5stack/M5Unified@^0.2.20
    m5stack/M5GFX@^0.2.27
    esp32async/ESPAsyncWebServer@^3.12.0

; Diagnostic-only: isolates Serial/HWCDC from M5Unified/WiFi entirely, to
; find out whether the "no bytes ever arrive" problem in ADR 0049's addendum
; is USB-CDC itself or something in the app code. See main_serial_test.cpp.
[env:tab5-serialtest]
extends = env:tab5
build_src_filter =
    -<*>
    +<main_serial_test.cpp>

; Mirroring milestone: continuous tile-budgeted readback + WebSocket push,
; via lib/CardputerMirror (ADR 0002/0038), reusing the same checkerboard
; test pattern the screenshot milestone (ADR 0049) already proved correct.
; Also the keyboard-input milestone (ADR 0052/0053): adapter-driven begin()
; wires the I2C keyboard driver in as a real IInputSink, so tab5_keyboard.cpp
; and tab5_adapter.cpp are needed here too.
[env:tab5-mirror]
extends = env:tab5
build_src_filter =
    -<*>
    +<main_tab5_mirror.cpp>
    +<tab5_keyboard.cpp>
    +<tab5_adapter.cpp>

; Keyboard proof of life (ADR 0052): standalone, no WiFi/mirror, isolates
; the I2C keyboard accessory the same way main_serial_test.cpp isolated
; USB-CDC. tab5_keyboard.cpp (the driver) is included via the default
; +<*> -- it's inert in every other env, just unused compiled code.
[env:tab5-keyboard]
extends = env:tab5
build_src_filter =
    -<*>
    +<main_tab5_keyboard.cpp>
    +<tab5_keyboard.cpp>
