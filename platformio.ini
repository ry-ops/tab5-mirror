; M5Stack Tab5 — ADR 0049
[env:tab5]
platform  = https://github.com/pioarduino/platform-espressif32.git#55.03.311
board     = esp32-p4-evboard
framework = arduino
board_build.mcu = esp32p4
board_build.flash_mode = qio
board_upload.flash_size = 16MB
monitor_speed = 115200
upload_speed  = 1500000

; No dedicated m5stack-tab5 board profile exists upstream yet (checked
; pioarduino/platform-espressif32's boards/ dir directly — only
; esp32-p4-evboard.json and its _r3 variant). esp32-p4-evboard already
; carries flash=16MB, flash_mode=qio, f_cpu=360MHz and a 200MHz PSRAM
; frequency, which is what Tab5 needs; SDIO pins differ from the evboard
; and are overridden in code via WiFi.setPins() before WiFi.begin().
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Forces M5GFX straight to the board_M5Tab5 (=22, boards.hpp) init path,
    ; skipping its full multi-board I2C/SPI autodetection gauntlet. Without
    ; this, M5.begin() probes every board M5GFX supports in sequence on a
    ; generic/unforced board profile -- and on real Tab5 hardware this hung
    ; before ever reaching our own Serial.begin() call (proven by isolating
    ; Serial/HWCDC in main_serial_test.cpp, which worked fine standalone).
    -DM5GFX_BOARD=22

; Screenshot milestone (ADR 0049) is self-contained and does not touch
; menu.cpp/keyinject.cpp (Cardputer TCA8418 keyboard) or wifi_manager*.cpp
; (multi-profile/SoftAP logic, deliberately not used yet). Excluded so a
; Tab5 build failure can only be the Tab5 bring-up itself.
build_src_filter =
    +<*>
    -<menu.cpp>
    -<keyinject.cpp>
    -<wifi_manager.cpp>
    -<wifi_manager_rt.cpp>
    -<main.cpp>
    -<main_serial_test.cpp>
    -<main_tab5_mirror.cpp>
    -<main_tab5_mirror_sdbench.cpp>
    -<main_tab5_keyboard.cpp>
    -<main_tab5_sdtest.cpp>
    -<main_tab5_ble.cpp>
    -<main_tab5_sdmmc_test.cpp>
    -<main_tab5_sdmmc_idf_test.cpp>
    -<main_tab5_sdmmc_nom5_test.cpp>

lib_deps =
    m5stack/M5Unified@^0.2.20
    m5stack/M5GFX@^0.2.27
    esp32async/ESPAsyncWebServer@^3.12.0

; Diagnostic-only: isolates Serial/HWCDC from M5Unified/WiFi entirely, to
; find out whether the "no bytes ever arrive" problem in ADR 0049's addendum
; is USB-CDC itself or something in the app code. See main_serial_test.cpp.
[env:tab5-serialtest]
extends = env:tab5
build_src_filter =
    -<*>
    +<main_serial_test.cpp>

; Mirroring milestone: continuous tile-budgeted readback + WebSocket push,
; via lib/CardputerMirror (ADR 0002/0038), reusing the same checkerboard
; test pattern the screenshot milestone (ADR 0049) already proved correct.
; Also the keyboard-input milestone (ADR 0052/0053): adapter-driven begin()
; wires the I2C keyboard driver in as a real IInputSink, so tab5_keyboard.cpp
; and tab5_adapter.cpp are needed here too.
[env:tab5-mirror]
extends = env:tab5
build_src_filter =
    -<*>
    +<main_tab5_mirror.cpp>
    +<tab5_keyboard.cpp>
    +<tab5_adapter.cpp>

; Keyboard proof of life (ADR 0052): standalone, no WiFi/mirror, isolates
; the I2C keyboard accessory the same way main_serial_test.cpp isolated
; USB-CDC. tab5_keyboard.cpp (the driver) is included via the default
; +<*> -- it's inert in every other env, just unused compiled code.
[env:tab5-keyboard]
extends = env:tab5
build_src_filter =
    -<*>
    +<main_tab5_keyboard.cpp>
    +<tab5_keyboard.cpp>

; microSD proof of life: isolates the SD card the same way main_serial_test
; isolated USB-CDC and main_tab5_keyboard isolated the keyboard accessory.
; Tests M5Stack's own official example (SD.begin(cs, SPI, 25000000), an
; EXPLICIT 25MHz clock) against pins Launcher's Tab5 board profile also
; uses but without a clock argument -- Launcher's own attempt fails
; (cardType() reads CARD_NONE) on this same real hardware.
[env:tab5-sdtest]
extends = env:tab5
build_src_filter =
    -<*>
    +<main_tab5_sdtest.cpp>

; ADR 0058: SD + mirror concurrent-load profiling harness. Every env above
; keeps SD (tab5-sdtest) and the web mirror (tab5-mirror) as separate
; firmware images -- this is the first env where both run in the same
; process, so the reported "SD + streaming don't perform well concurrently"
; symptom has a code path to reproduce and measure at all. CMIRROR_PROFILE
; turns on CardputerMirror's own opt-in per-stage timing (capture/encode/
; publish) so its heartbeat print carries those numbers alongside the SD
; write/read timing main_tab5_mirror_sdbench.cpp adds itself. SD I/O runs
; inline in loop() here -- the worst-case, fully-blocking baseline.
[env:tab5-mirror-sdbench]
extends = env:tab5-mirror
build_flags =
    ${env:tab5-mirror.build_flags}
    -DCMIRROR_PROFILE=1
build_src_filter =
    -<*>
    +<main_tab5_mirror_sdbench.cpp>
    +<tab5_keyboard.cpp>
    +<tab5_adapter.cpp>

; Same bench, SD I/O moved onto its own FreeRTOS task (pinned off loop()'s
; core) instead of running inline -- see main_tab5_mirror_sdbench.cpp's
; SD_BENCH_TASK block. Compares against tab5-mirror-sdbench above to answer
; "does decoupling SD off the main loop actually help here".
[env:tab5-mirror-sdbench-task]
extends = env:tab5-mirror-sdbench
build_flags =
    ${env:tab5-mirror-sdbench.build_flags}
    -DSD_BENCH_TASK=1

; BLE scanner proof of life: Tab5 has no onboard Bluetooth radio -- BLE, like
; WiFi, is routed through the ESP32-C6 co-processor over the same SDIO
; ESP-Hosted link (ADR 0048). Untested whether the standard arduino-esp32
; BLEDevice API works over that link on ESP32-P4 with no WiFi connection
; active -- this is the smallest possible proof before building anything on
; top of it.
[env:tab5-ble]
extends = env:tab5
build_flags =
    ${env.build_flags}
    ; Quiets BLEScan's own internal per-advertisement log_i() noise
    ; (handleGAPEvent floods several lines per device per scan cycle) --
    ; last -D wins, so this overrides the base env's CORE_DEBUG_LEVEL=3
    ; for this env only.
    -DCORE_DEBUG_LEVEL=1
build_src_filter =
    -<*>
    +<main_tab5_ble.cpp>

; SD_MMC + on-chip LDO isolated retest: an earlier tab5-launcher attempt at
; SD_MMC crashed (H_SDIO_DRV register-read failure) with WiFi already up --
; assumed at the time to be a WiFi/SDMMC host-slot conflict. Since then,
; M5Stack's own official UserDemo BSP source was found to explicitly enable
; ESP32-P4's on-chip LDO (channel 4) before any SD access -- something
; neither that crashed attempt nor generic Arduino SD_MMC/SD code does.
; Every variation tried on the generic esp32-p4-evboard board (manual LDO,
; SD_MMC.setPowerChannel(4), a manually-forced -D BOARD_SDMMC_SLOT=0,
; M5.Power.setExtOutput(true), WiFi up vs. entirely absent) failed
; identically with sdmmc_init_ocr 0x107 (ESP_ERR_TIMEOUT) on the very first
; card command. platform-espressif32 ships an actual maintained
; "m5stack-tab5-p4" board profile (boards/m5stack-tab5-p4.json) with its own
; variants/m5stack_tab5/pins_arduino.h defining BOARD_HAS_SDMMC,
; BOARD_SDMMC_SLOT=0, and BOARD_HAS_SDIO_ESP_HOSTED (+ its pin set) for
; real -- switching to it instead of hand-rolling the same flags on the
; generic evboard profile, in case something in that variant (beyond just
; BOARD_SDMMC_SLOT) is needed and was missing from every manual attempt.
[env:tab5-sdmmc-test]
extends = env:tab5
board = m5stack-tab5-p4
build_src_filter =
    -<*>
    +<main_tab5_sdmmc_test.cpp>

; Same isolated question, but bypassing arduino-esp32's SD_MMC.cpp wrapper
; entirely -- calls esp_vfs_fat_sdmmc_mount() directly with the exact
; host/slot/mount config M5Stack's own official BSP uses (SDMMC_FREQ_HIGHSPEED,
; 16KB allocation unit, sd_pwr_ctrl_new_on_chip_ldo() called the same way).
; Every SD_MMC-wrapper-level variation above failed identically -- this
; isolates whether the Arduino wrapper itself is where the gap is.
[env:tab5-sdmmc-idf-test]
extends = env:tab5-sdmmc-test
build_src_filter =
    -<*>
    +<main_tab5_sdmmc_idf_test.cpp>

; Same raw-ESP-IDF mount call, but with M5Unified/M5GFX removed from setup()
; entirely -- tests whether M5GFX's Tab5 display/touch autodetect (DSI init,
; heavy I2C probing) is starving a shared resource (GDMA channel etc.) that
; the SDMMC peripheral also needs, independent of every pin/power/slot
; config already verified to match the official BSP exactly.
[env:tab5-sdmmc-nom5-test]
extends = env:tab5-sdmmc-test
build_src_filter =
    -<*>
    +<main_tab5_sdmmc_nom5_test.cpp>

; Same test, but forcing the PRODUCTION-silicon prebuilt libs
; (framework-arduinoespressif32-libs/esp32p4, not .../esp32p4_es) instead of
; the "ES pre rev.300" engineering-sample variant both board profiles
; (esp32-p4-evboard AND the maintained m5stack-tab5-p4) default to. A
; community thread (community.m5stack.com/topic/7822) reporting a working
; Arduino-based Tab5 SD mount lists their chip as "ESP32-P4 revision 1.00"
; (production silicon) -- if the ES-targeted prebuilt SDMMC driver .a
; doesn't match this board's actual (production) silicon timing/erratum
; behavior, that would explain every caller-side config matching the
; official BSP exactly and still failing identically.
[env:tab5-sdmmc-prodsi-test]
extends = env:tab5-sdmmc-nom5-test
board_build.chip_variant = esp32p4
